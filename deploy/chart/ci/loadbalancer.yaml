apiVersion: v1
kind: ServiceAccount
metadata:
  name: avsys
  namespace: avsys
  labels:
    app.kubernetes.io/name: avsys
    app.kubernetes.io/instance: avsys
    app.kubernetes.io/version: "sha-1234567"
