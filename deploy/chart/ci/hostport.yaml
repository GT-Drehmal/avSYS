# Snapshots of every organization's servers. Size it for the worlds you host,
# on storage you would be sorry to lose.
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: avsys-backups
  namespace: avsys
  labels:
    app.kubernetes.io/name: avsys
    app.kubernetes.io/instance: avsys
