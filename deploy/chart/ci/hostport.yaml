---
# Source: avsys/templates/service.yaml
# The panel, SSH and the Minecraft router. Players and SSH need plain TCP;
# put the panel's http port behind an ingress for TLS if you prefer.
apiVersion: v1
kind: Service
metadata:
  name: avsys
  namespace: avsys
  labels:
    app.kubernetes.io/name: avsys
    app.kubernetes.io/instance: avsys
    app.kubernetes.io/version: "v0.1.0"
    app.kubernetes.io/managed-by: Helm
    helm.sh/chart: avsys-0.0.0-dev
spec:
  # The ports are opened on the node itself (hostPort); this is for the
  # cluster's own use.
  type: ClusterIP
  selector:
    app.kubernetes.io/name: avsys
  ports:
    - name: http
      port: 80
      targetPort: http
    - name: ssh
      port: 2222
      targetPort: ssh
    - name: minecraft
      port: 25565
      targetPort: minecraft
    - name: packs
      port: 8081
      targetPort: packs

---
# Source: avsys/templates/deployment.yaml
apiVersion: apps/v1
kind: Deployment
metadata:
  name: avsys
  namespace: avsys
  labels:
    app.kubernetes.io/name: avsys
    app.kubernetes.io/instance: avsys
    app.kubernetes.io/version: "v0.1.0"
    app.kubernetes.io/managed-by: Helm
    helm.sh/chart: avsys-0.0.0-dev
spec:
  replicas: 1
  # The database is a single file on a ReadWriteOnce volume, so the old pod
  # must be gone before the new one starts.
  strategy:
    type: Recreate
  selector:
    matchLabels:
      app.kubernetes.io/name: avsys
  template:
    metadata:
      labels:
        app.kubernetes.io/name: avsys
        app.kubernetes.io/instance: avsys
        app.kubernetes.io/version: "v0.1.0"
        app.kubernetes.io/managed-by: Helm
        helm.sh/chart: avsys-0.0.0-dev
    spec:
      serviceAccountName: avsys
      securityContext:
        runAsNonRoot: true
        runAsUser: 65532
        runAsGroup: 65532
        fsGroup: 65532
      nodeSelector:
        kubernetes.io/hostname: node-1
      containers:
        - name: avsys
          image: "ghcr.io/gt-drehmal/avsys:v0.1.0"
          imagePullPolicy: IfNotPresent
          env:
            - name: AVSYS_PUBLIC_URL
              value: "https://panel.example.org"
            - name: AVSYS_BACKUP_DIR
              value: /backups
            # Servers' extra ports are pointed at the panel while their games
            # are not running, so that reaching one wakes a sleeping server.
            - name: AVSYS_POD_IP
              valueFrom:
                fieldRef:
                  fieldPath: status.podIP
            # The Service that carries the router, whose address servers'
            # extra ports share.
            - name: AVSYS_ROUTER_SERVICE
              value: avsys
            - name: AVSYS_ROUTER_PUBLIC_PORT
              value: "25566"
            - name: AVSYS_SSH_PUBLIC_PORT
              value: "2222"
            - name: AVSYS_PACK_ADDR
              value: ":8081"
            - name: AVSYS_PACK_URL
              value: "http://play.example.org:8081"
            - name: AVSYS_PACK_CACHE
              value: "2048"
            - name: AVSYS_ALLOW_SIGNUPS
              value: "true"
            - name: AVSYS_PASSWORDS
              value: "true"
            - name: AVSYS_TWO_FACTOR
              value: "admins"
            - name: AVSYS_NAMESPACE_PREFIX
              value: "mc-"
            - name: AVSYS_INSTALL_CRDS
              value: "true"
            - name: AVSYS_UPDATE_CHECK
              value: "true"
            # A key put in this Secret later is used from the next start;
            # one can also be entered in the panel.
            - name: AVSYS_CURSEFORGE_API_KEY
              valueFrom:
                secretKeyRef:
                  name: avsys-curseforge
                  key: api-key
                  optional: true
          ports:
            - name: http
              containerPort: 8080
              hostPort: 8080
            - name: ssh
              containerPort: 2222
              hostPort: 2222
            - name: minecraft
              containerPort: 25565
              hostPort: 25566
            - name: packs
              containerPort: 8081
              hostPort: 8081
          readinessProbe:
            httpGet:
              path: /api/v1/meta
              port: http
          resources:
            limits:
              memory: 1Gi
            requests:
              cpu: 50m
              memory: 128Mi
          volumeMounts:
            - name: data
              mountPath: /data
            - name: backups
              mountPath: /backups
      volumes:
        - name: data
          persistentVolumeClaim:
            claimName: avsys-data
        - name: backups
          persistentVolumeClaim:
            claimName: avsys-backups
