---
# Source: avsys/templates/service.yaml
# The panel, SSH and the Minecraft router. Players and SSH need plain TCP;
# put the panel's http port behind an ingress for TLS if you prefer.
apiVersion: v1
kind: Service
metadata:
  name: avsys
  namespace: avsys
  labels:
    app.kubernetes.io/name: avsys
    app.kubernetes.io/instance: avsys
    app.kubernetes.io/version: "edge"
    app.kubernetes.io/managed-by: Helm
    helm.sh/chart: avsys-0.0.0-dev
spec:
  type: NodePort
  selector:
    app.kubernetes.io/name: avsys
  ports:
    - name: http
      port: 80
      targetPort: http
    - name: ssh
      port: 2222
      targetPort: ssh
      nodePort: 30022
    - name: minecraft
      port: 25565
      targetPort: minecraft
      nodePort: 30565

---
# Source: avsys/templates/deployment.yaml
apiVersion: apps/v1
kind: Deployment
metadata:
  name: avsys
  namespace: avsys
  labels:
    app.kubernetes.io/name: avsys
    app.kubernetes.io/instance: avsys
    app.kubernetes.io/version: "edge"
    app.kubernetes.io/managed-by: Helm
    helm.sh/chart: avsys-0.0.0-dev
spec:
  replicas: 1
  # The database is a single file on a ReadWriteOnce volume, so the old pod
  # must be gone before the new one starts.
  strategy:
    type: Recreate
  selector:
    matchLabels:
      app.kubernetes.io/name: avsys
  template:
    metadata:
      labels:
        app.kubernetes.io/name: avsys
        app.kubernetes.io/instance: avsys
        app.kubernetes.io/version: "edge"
        app.kubernetes.io/managed-by: Helm
        helm.sh/chart: avsys-0.0.0-dev
      annotations:
        # Restarts the panel when a secret given in values changes.
        checksum/secret: b28d18d29c1a5a9ac255257e29ce8379ba18b9c2f875636003f873df7d5d442f
    spec:
      serviceAccountName: avsys
      securityContext:
        runAsNonRoot: true
        runAsUser: 65532
        runAsGroup: 65532
        fsGroup: 65532
      containers:
        - name: avsys
          image: "ghcr.io/gt-drehmal/avsys:edge"
          imagePullPolicy: Always
          env:
            - name: AVSYS_PUBLIC_URL
              value: "https://panel.example.org"
            - name: AVSYS_BACKUP_DIR
              value: /backups
            # Servers' extra ports are pointed at the panel while their games
            # are not running, so that reaching one wakes a sleeping server.
            - name: AVSYS_POD_IP
              valueFrom:
                fieldRef:
                  fieldPath: status.podIP
            # The Service that carries the router, whose address servers'
            # extra ports share.
            - name: AVSYS_ROUTER_SERVICE
              value: avsys
            - name: AVSYS_ROUTER_PUBLIC_PORT
              value: "30565"
            - name: AVSYS_SSH_PUBLIC_PORT
              value: "30022"
            - name: AVSYS_PACK_CACHE
              value: "512"
            - name: AVSYS_ALLOW_SIGNUPS
              value: "false"
            - name: AVSYS_PASSWORDS
              value: "true"
            - name: AVSYS_NAMESPACE_PREFIX
              value: "mc-"
            - name: AVSYS_INSTALL_CRDS
              value: "true"
            - name: AVSYS_UPDATE_CHECK
              value: "true"
            - name: AVSYS_GITHUB_CLIENT_ID
              value: "github-id"
            - name: AVSYS_GITHUB_CLIENT_SECRET
              valueFrom:
                secretKeyRef:
                  name: avsys
                  key: github-client-secret
            - name: AVSYS_DISCORD_CLIENT_ID
              value: "discord-id"
            - name: AVSYS_DISCORD_CLIENT_SECRET
              valueFrom:
                secretKeyRef:
                  name: avsys
                  key: discord-client-secret
            - name: AVSYS_CURSEFORGE_API_KEY
              valueFrom:
                secretKeyRef:
                  name: avsys
                  key: curseforge-api-key
            - name: AVSYS_OFFSITE_REPOSITORY
              value: "s3:https://s3.example.org/bucket/avsys"
            - name: AVSYS_OFFSITE_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: avsys
                  key: offsite-password
          ports:
            - name: http
              containerPort: 8080
            - name: ssh
              containerPort: 2222
            - name: minecraft
              containerPort: 25565
          readinessProbe:
            httpGet:
              path: /api/v1/meta
              port: http
          resources:
            limits:
              memory: 1Gi
            requests:
              cpu: 50m
              memory: 128Mi
          volumeMounts:
            - name: data
              mountPath: /data
            - name: backups
              mountPath: /backups
      volumes:
        - name: data
          persistentVolumeClaim:
            claimName: avsys-data
        - name: backups
          persistentVolumeClaim:
            claimName: avsys-backups
