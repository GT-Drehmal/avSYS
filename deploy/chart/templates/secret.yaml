{{- if include "avsys.ownSecret" . }}
# Secrets given in values.
apiVersion: v1
kind: Secret
metadata:
  name: {{ include "avsys.secretName" . }}
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "avsys.labels" . | nindent 4 }}
type: Opaque
stringData:
  {{- if not .Values.signIn.existingSecret }}
  {{- range $id := list "github" "discord" "google" "oidc" }}
  {{- $p := index $.Values.signIn $id }}
  {{- if and $p.clientId $p.clientSecret }}
  {{ $id }}-client-secret: {{ $p.clientSecret | quote }}
  {{- end }}
  {{- end }}
  {{- end }}
  {{- if and .Values.curseforge.apiKey (not .Values.curseforge.existingSecret) }}
  curseforge-api-key: {{ .Values.curseforge.apiKey | quote }}
  {{- end }}
  {{- if and .Values.offsite.repository .Values.offsite.password (not .Values.offsite.existingSecret) }}
  offsite-password: {{ .Values.offsite.password | quote }}
  {{- end }}
{{- end }}
