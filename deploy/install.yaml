# Installs avSYS into the `avsys` namespace.
#
#   kubectl apply -f deploy/install.yaml
#
# Before applying, set AVSYS_PUBLIC_URL below to the address you will open the
# panel at, and pick how the three ports are exposed (see the Service at the
# bottom). The MinecraftServer CRD is installed by the panel itself on startup.
apiVersion: v1
kind: Namespace
metadata:
  name: avsys
---
apiVersion: v1
kind: ServiceAccount
metadata:
  name: avsys
  namespace: avsys
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  name: avsys
rules:
  # The panel's own resource.
  - apiGroups: ["avsys.dev"]
    resources: ["minecraftservers", "minecraftservers/status"]
    verbs: ["get", "list", "watch", "create", "update", "patch", "delete"]
  # Installing and upgrading the CRD on startup.
  - apiGroups: ["apiextensions.k8s.io"]
    resources: ["customresourcedefinitions"]
    verbs: ["get", "create", "patch"]
  # One namespace per organization, and one for a while to measure nodes'
  # speed in; those are listed to remove any a restart left behind.
  - apiGroups: [""]
    resources: ["namespaces"]
    verbs: ["get", "list", "create", "delete"]
  # What each server is made of.
  - apiGroups: [""]
    resources: ["pods", "services"]
    verbs: ["get", "list", "watch", "create", "update", "patch", "delete"]
  # Deleted only when a server is moved off a node its volume is tied to,
  # its files then being in a snapshot.
  - apiGroups: [""]
    resources: ["persistentvolumeclaims"]
    verbs: ["get", "create", "patch", "delete"]
  # Choosing a node for a new server: node speed scores and free memory,
  # and which node an existing volume is tied to.
  - apiGroups: [""]
    resources: ["nodes", "persistentvolumes"]
    verbs: ["get", "list"]
  # Setting a node's speed score, and whether it takes new servers, from
  # the Nodes page. Only labels are changed.
  - apiGroups: [""]
    resources: ["nodes"]
    verbs: ["patch"]
  # RCON passwords and the workspace key. Read one at a time, never listed.
  - apiGroups: [""]
    resources: ["secrets"]
    verbs: ["get", "create", "update"]
  # Console output, and reaching pods when the panel runs outside the cluster.
  - apiGroups: [""]
    resources: ["pods/log", "pods/portforward"]
    verbs: ["get", "create"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding
metadata:
  name: avsys
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: ClusterRole
  name: avsys
subjects:
  - kind: ServiceAccount
    name: avsys
    namespace: avsys
---
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: avsys-data
  namespace: avsys
spec:
  accessModes: ["ReadWriteOnce"]
  resources:
    requests:
      storage: 1Gi
---
# Snapshots of every organization's servers are kept here. Size it for the
# worlds you host: a snapshot only stores what changed since the last, but the
# first one of each server is about the size of that server. Put it on storage
# you would be sorry to lose, since this is the only copy until an offsite one
# is set up.
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: avsys-backups
  namespace: avsys
spec:
  accessModes: ["ReadWriteOnce"]
  resources:
    requests:
      storage: 50Gi
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: avsys
  namespace: avsys
spec:
  replicas: 1
  # The database is a single file on a ReadWriteOnce volume, so the old pod
  # must be gone before the new one starts.
  strategy:
    type: Recreate
  selector:
    matchLabels:
      app.kubernetes.io/name: avsys
  template:
    metadata:
      labels:
        app.kubernetes.io/name: avsys
    spec:
      serviceAccountName: avsys
      securityContext:
        runAsNonRoot: true
        runAsUser: 65532
        runAsGroup: 65532
        fsGroup: 65532
      containers:
        - name: avsys
          # :edge follows the main branch. For a fixed version use a release
          # tag such as :v0.1.0 and drop imagePullPolicy.
          image: ghcr.io/gt-drehmal/avsys:edge
          imagePullPolicy: Always
          env:
            - name: AVSYS_PUBLIC_URL
              value: https://panel.example.com
            - name: AVSYS_BACKUP_DIR
              value: /backups
            # An offsite copy of every organization's snapshots, in any place
            # restic can reach without ssh: S3 and what speaks it (Backblaze
            # B2, Cloudflare R2, Wasabi), Azure, Google Cloud, a rest-server.
            # The bucket has to exist. Keep a copy of the password somewhere
            # else: it is what opens the copy once this cluster is gone.
            # - name: AVSYS_OFFSITE_REPOSITORY
            #   value: s3:https://s3.us-west-004.backblazeb2.com/my-bucket/avsys
            # - name: AVSYS_OFFSITE_PASSWORD
            #   valueFrom: { secretKeyRef: { name: avsys-offsite, key: password } }
            # - name: AWS_ACCESS_KEY_ID
            #   valueFrom: { secretKeyRef: { name: avsys-offsite, key: access-key-id } }
            # - name: AWS_SECRET_ACCESS_KEY
            #   valueFrom: { secretKeyRef: { name: avsys-offsite, key: secret-access-key } }
            # Hostname shown in SSH instructions, if it differs from the panel's.
            # - name: AVSYS_SSH_PUBLIC_HOST
            #   value: ssh.example.com
            # A domain with a wildcard DNS record pointing at the router: new
            # servers then default to <server>.<org>.<domain>.
            # - name: AVSYS_ROUTER_DOMAIN
            #   value: mc.example.com
            # Sign-in providers: add the client ID and secret of each you want.
            # - name: AVSYS_GITHUB_CLIENT_ID
            # - name: AVSYS_GITHUB_CLIENT_SECRET
            # - name: AVSYS_DISCORD_CLIENT_ID
            # - name: AVSYS_DISCORD_CLIENT_SECRET
            # - name: AVSYS_GOOGLE_CLIENT_ID
            # - name: AVSYS_GOOGLE_CLIENT_SECRET
          ports:
            - { name: http, containerPort: 8080 }
            - { name: ssh, containerPort: 2222 }
            - { name: minecraft, containerPort: 25565 }
          readinessProbe:
            httpGet: { path: /api/v1/meta, port: http }
          resources:
            requests: { cpu: 50m, memory: 128Mi }
            # Pruning a large snapshot repository is what needs the room.
            limits: { memory: 1Gi }
          volumeMounts:
            - { name: data, mountPath: /data }
            - { name: backups, mountPath: /backups }
      volumes:
        - name: data
          persistentVolumeClaim:
            claimName: avsys-data
        - name: backups
          persistentVolumeClaim:
            claimName: avsys-backups
---
# Players and SSH need plain TCP, so this is a LoadBalancer (k3s ServiceLB and
# MetalLB both work). Put the panel's HTTP port behind your ingress for TLS if
# you prefer; it is included here so a fresh install is reachable.
apiVersion: v1
kind: Service
metadata:
  name: avsys
  namespace: avsys
spec:
  type: LoadBalancer
  selector:
    app.kubernetes.io/name: avsys
  ports:
    - { name: http, port: 80, targetPort: http }
    - { name: ssh, port: 2222, targetPort: ssh }
    - { name: minecraft, port: 25565, targetPort: minecraft }
