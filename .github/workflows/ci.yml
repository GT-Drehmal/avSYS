name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
      - uses: oven-sh/setup-bun@v2
      - name: Go
        run: |
          test -z "$(gofmt -l .)"
          go vet ./...
          go test ./...
      - name: Generated code is current
        run: |
          go run sigs.k8s.io/controller-tools/cmd/controller-gen@latest object crd paths=./api/... output:crd:dir=deploy/crds
          git diff --exit-code -- api deploy/crds
      - name: Web
        working-directory: web
        run: |
          bun install --frozen-lockfile
          bun run build
      - name: Images build
        run: |
          docker build -t avsys:ci .
          docker build -t avsys-workspace:ci images/workspace
