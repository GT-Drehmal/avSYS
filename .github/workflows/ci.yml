name: CI

on:
  push:
    branches: [main]
    tags: ["v*"]
  pull_request:

# Nothing here may write to the repository. The one job that publishes asks
# for what it needs itself.
permissions:
  contents: read

# A pull request that is pushed to again does not need its earlier run
# finished. Runs on main and on tags each get a group of their own, so that
# several merges in a row are tested side by side and not one after another;
# only publishing takes turns, further down.
concurrency:
  group: ${{ github.workflow }}-${{ github.event_name == 'pull_request' && github.ref || github.run_id }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

# Actions are named by the commit they are, with the release that is in a
# comment, so that a tag moved under us changes nothing. Dependabot keeps
# both current.
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
      - name: Go
        run: |
          test -z "$(gofmt -l .)"
          go vet ./...
          go test ./...
      # Fails on a known vulnerability in code this project actually calls,
      # its own or the standard library's, and says which release fixes it.
      - name: Known vulnerabilities
        run: go run golang.org/x/vuln/cmd/govulncheck@v1.9.0 ./...
      # The snapshot engine against a real workspace container: that a server
      # can add to its organization's repository but not delete from it, and
      # that a restore touches nothing outside the server's own files.
      - name: Snapshots
        run: |
          docker build -q -t avsys-workspace:ci -f images/workspace/Dockerfile .
          docker cp "$(docker create avsys-workspace:ci)":/usr/local/bin/restic /usr/local/bin/restic
          AVSYS_TEST_WORKSPACE_IMAGE=avsys-workspace:ci go test -count=1 ./internal/backup/
      - name: Generated code is current
        run: |
          make generate
          git diff --exit-code -- api deploy/crds
      - name: Web
        working-directory: web
        run: |
          bun install --frozen-lockfile
          bun run build
      # Pushes build the images in the publish job below; pull requests only
      # need to know that they still build.
      - name: Images build
        if: github.event_name == 'pull_request'
        run: |
          docker build -t avsys:ci .
          docker build -t avsys-workspace:ci -f images/workspace/Dockerfile .

  # Installs the panel into an empty cluster the way a user would, then runs a
  # real Minecraft server through it. This is what catches a broken manifest,
  # missing permissions or a panel that cannot make its first start.
  e2e:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: End to end
        run: ./hack/e2e-cluster.sh

  # Publishes the panel and workspace images to GitHub's container registry,
  # once the tests above pass.
  #
  #   push to main   ->  :edge and :sha-<commit>
  #   tag v1.2.3     ->  :v1.2.3 and :latest
  #
  # The panel is built knowing its own version, and starts the workspace image
  # with that same tag, so the two always match.
  publish:
    needs: [test, e2e]
    if: github.event_name == 'push'
    runs-on: ubuntu-latest
    # Publishes of main take turns, so that two builds do not write :edge at
    # once. Of several waiting, GitHub keeps the newest and drops the rest:
    # a commit that another has already followed onto main is then not
    # published under its own tag, which nothing needs.
    #
    # A release is never one of several: each has a group to itself, so
    # that none is dropped for another arriving.
    concurrency:
      group: publish-${{ github.ref_type == 'tag' && github.ref_name || 'main' }}
      cancel-in-progress: false
    permissions:
      contents: read
      packages: write
    env:
      PANEL: ghcr.io/gt-drehmal/avsys
      WORKSPACE: ghcr.io/gt-drehmal/avsys-workspace
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Version
        id: version
        run: |
          if [ "$GITHUB_REF_TYPE" = tag ]; then
            echo "version=$GITHUB_REF_NAME" >> "$GITHUB_OUTPUT"
            echo "moving=latest" >> "$GITHUB_OUTPUT"
          else
            echo "version=sha-$(echo "$GITHUB_SHA" | cut -c1-7)" >> "$GITHUB_OUTPUT"
            # Taking turns puts publishes in the order their tests finished,
            # which need not be the order of the commits. :edge is only
            # moved by the commit main is at right now: an older one that
            # gets here late publishes under its own tag and leaves :edge
            # where the newer one put it, or will.
            tip=$(git ls-remote origin refs/heads/main | cut -f1)
            if [ "$tip" = "$GITHUB_SHA" ]; then
              echo "moving=edge" >> "$GITHUB_OUTPUT"
            else
              echo "main has moved on to $tip; publishing $GITHUB_SHA under its own tag only"
            fi
          fi
      - uses: docker/setup-qemu-action@99012661954931238ded8c8b007157a8430204e1 # v4.4.0
      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1
      - uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4.6.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      # The workspace goes first: a panel must never be published pointing at
      # a workspace image that is not there yet.
      - name: Workspace image
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: .
          file: images/workspace/Dockerfile
          platforms: linux/amd64,linux/arm64
          push: true
          tags: |
            ${{ env.WORKSPACE }}:${{ steps.version.outputs.version }}
            ${{ steps.version.outputs.moving && format('{0}:{1}', env.WORKSPACE, steps.version.outputs.moving) || '' }}
          cache-from: type=gha,scope=workspace
          cache-to: type=gha,scope=workspace,mode=max
      - name: Panel image
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: .
          platforms: linux/amd64,linux/arm64
          push: true
          build-args: VERSION=${{ steps.version.outputs.version }}
          tags: |
            ${{ env.PANEL }}:${{ steps.version.outputs.version }}
            ${{ steps.version.outputs.moving && format('{0}:{1}', env.PANEL, steps.version.outputs.moving) || '' }}
          cache-from: type=gha,scope=panel
          cache-to: type=gha,scope=panel,mode=max
