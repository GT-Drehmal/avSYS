# Keeps what the project is built from current: once a week, one pull request
# per kind of dependency, so that updates arrive as a few things to look at
# and not a stream. Each goes through the same checks as any other change.
version: 2
updates:
  - package-ecosystem: gomod
    directory: /
    schedule: { interval: weekly }
    groups:
      go:
        patterns: ["*"]
  - package-ecosystem: bun
    directory: /web
    schedule: { interval: weekly }
    groups:
      web:
        patterns: ["*"]
  - package-ecosystem: github-actions
    directory: /
    schedule: { interval: weekly }
    groups:
      actions:
        patterns: ["*"]
  # The images the panel and the workspace are built from. They are named by
  # digest, so a new build of a tag (a Go patch release, Debian's fixes)
  # arrives here as a pull request and not by itself. restic is built from
  # its source and is not followed here: see images/restic/build.sh.
  - package-ecosystem: docker
    directories: ["/", "/images/workspace"]
    schedule: { interval: weekly }
    groups:
      images:
        patterns: ["*"]
